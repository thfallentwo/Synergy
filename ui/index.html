<!doctype html>
<html lang="tr" data-theme="dark" data-accent="sapphire" data-font="inter">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masiva Labs</title>
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/app.css" />
  <meta name="synergy-token" content="__SYNERGY_TOKEN__" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-aurora"></div>
    <div class="ambient-dots"></div>
  </div>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Ana menü">
      <div class="sidebar-head">
        <div class="sidebar-brand" title="Masiva Labs">
          <svg class="brand-dots" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <circle cx="5.5" cy="6.5" r="2.1" />
            <circle cx="5.5" cy="12" r="2.1" />
            <circle cx="5.5" cy="17.5" r="2.1" />
            <circle cx="12" cy="10.2" r="2.2" />
            <circle cx="18.5" cy="6.5" r="2.1" />
            <circle cx="18.5" cy="12" r="2.1" />
            <circle cx="18.5" cy="17.5" r="2.1" />
          </svg>
          <span class="sidebar-label">Masiva Labs</span>
        </div>
        <button type="button" id="btn-sidebar-toggle" class="sidebar-toggle" title="Menüyü Genişlet / Daralt" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <path d="M9 4v16" />
          </svg>
        </button>
      </div>

      <button type="button" id="btn-new-chat" class="sidebar-new-chat" title="Yeni Sohbet">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span class="sidebar-label">Yeni Sohbet</span>
      </button>

      <nav class="sidebar-nav" aria-label="Görünümler">
        <button type="button" class="sidebar-nav-btn" data-view="agents" title="Agents">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6" cy="6" r="2.5" />
            <circle cx="18" cy="6" r="2.5" />
            <circle cx="12" cy="18" r="2.5" />
            <path d="M8 7.5 11 16m5-8.5L13 16M8.5 6h7" />
          </svg>
          <span class="sidebar-label">Agents</span>
        </button>
        <button type="button" class="sidebar-nav-btn" data-view="customization" title="Customization">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 9 9c0-1.1-.9-2-2-2h-1.8a1.5 1.5 0 0 1-1.4-2.1L16.5 6A4.5 4.5 0 0 0 12 3Z" />
            <circle cx="7.5" cy="11.5" r="1" fill="currentColor" />
            <circle cx="10" cy="7.5" r="1" fill="currentColor" />
            <circle cx="14.5" cy="7.5" r="1" fill="currentColor" />
          </svg>
          <span class="sidebar-label">Customization</span>
        </button>
        <button type="button" class="sidebar-nav-btn" data-view="canvas" title="Canvas">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="14" rx="2.5" />
            <path d="M8 21h8M12 18v3M7 13l3-3 3 2.5 4-4.5" />
          </svg>
          <span class="sidebar-label">Canvas</span>
        </button>
      </nav>

      <div class="sidebar-scroll">
        <section class="sidebar-section">
          <div class="sidebar-section-head">
            <span class="sidebar-label">Projects</span>
            <button type="button" id="btn-new-project" class="sidebar-mini-btn" title="Yeni Proje / Klasör Aç">+</button>
          </div>
          <div id="sidebar-projects" class="sidebar-list"></div>
        </section>

        <section class="sidebar-section">
          <div class="sidebar-section-head">
            <span class="sidebar-label">Conversations</span>
          </div>
          <div id="sidebar-chats" class="sidebar-list"></div>
        </section>
      </div>

      <div class="sidebar-foot">
        <div class="sidebar-profile-foot">
          <button type="button" id="btn-profile-open" class="sidebar-profile-btn" data-view="profile" title="Profil & Kullanım">
            <span class="profile-avatar-dot">M</span>
            <span class="sidebar-label">Profil</span>
          </button>
          <button type="button" id="btn-settings-quick" class="sidebar-mini-btn" data-view="settings" title="Ayarlar (Ctrl+,)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <main id="stage" class="stage" data-empty="true">
      <header class="topbar">
        <div class="topbar-left">
          <div class="pill-chip project-chip">
            <span class="dot-live"></span>
            <span id="project-name">Masiva Labs</span>
          </div>
          <div id="mcp-presence" class="presence-strip"></div>
        </div>

        <div id="top-mode-switch" class="mode-switch" data-active="direct" role="tablist" aria-label="Çalışma modu">
          <div id="mode-switch-thumb" class="mode-switch-thumb" aria-hidden="true"></div>
          <button type="button" class="mode-switch-btn" data-top-mode="direct" role="tab">Direct</button>
          <button type="button" class="mode-switch-btn" data-top-mode="task" role="tab">Task</button>
        </div>

        <div class="topbar-right">
          <button type="button" class="pill-chip accent-chip" id="btn-handoff-quick" title="Bağlamı başka ajana devret">
            Limit Devri
          </button>
          <button type="button" class="pill-chip right-toggle-btn" id="btn-right-toggle" title="Sağ Panel (Canlı, Hafıza, Kilitler, Dosyalar)" aria-expanded="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M15 4v16" />
            </svg>
            <span class="rail-badge" id="locks-badge" hidden>0</span>
          </button>
        </div>
      </header>

      <section id="stream-wrap" class="stream-wrap">
        <div id="hero-empty" class="hero-empty">
          <h1 class="hero-title">Nereden başlayalım?</h1>
          <p class="hero-sub">Çoklu ajan kodlama, otomatik diff denetimi ve sıfır kopyala-yapıştır bağlam devri.</p>
          <div class="quick-prompts">
            <button type="button" class="quick-chip" data-top-mode="task" data-submode="debate" data-prompt="Bu projenin mevcut mimarisini inceleyip riskleri ve en temiz sonraki adımı çıkarın.">Mimari İstişare</button>
            <button type="button" class="quick-chip" data-top-mode="task" data-submode="code_review" data-prompt="Son değişiklikleri veya hedef modülü inceleyip iyileştirme önerisi ve test planı üretin.">Kodla → İncele</button>
            <button type="button" class="quick-chip" data-open-rp="memory">Limit Devri Özeti</button>
          </div>
        </div>

        <div id="messages" class="messages"></div>
      </section>

      <div class="composer-dock">
        <div class="composer-halo" aria-hidden="true"></div>
        <div id="composer-wrap" class="composer-wrap">
          <div id="plus-popover" class="plus-popover" aria-hidden="true"></div>
          <div id="model-popover" class="model-popover" aria-hidden="true"></div>

          <form id="composer-form" class="composer-pill">
            <textarea
              id="prompt-input"
              rows="1"
              placeholder="Ajanlara görev ver..."
              autocomplete="off"
              spellcheck="false"
            ></textarea>

            <div class="composer-bar">
              <div class="composer-tools">
                <button type="button" id="btn-composer-plus" class="plus-btn" title="Ekle / Yükle" aria-expanded="false">+</button>
                <div id="task-submode-slot"></div>
                <button type="button" id="btn-write-toggle" class="tool-toggle" hidden title="Yazıcı ajanın dosyaları düzenlemesine izin ver">
                  Dosya Yazma
                </button>
                <button type="button" id="btn-mcp-target" class="tool-toggle" hidden title="Bitince IDE MCP ajanına devret">
                  → IDE MCP
                </button>
              </div>

              <div class="composer-actions">
                <button type="button" id="btn-model-trigger" class="model-trigger" aria-expanded="false">
                  <span id="model-trigger-content">Ajan Seç</span>
                  <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m4 6 4 4 4-4"/></svg>
                </button>
                <button type="submit" id="btn-send" class="send-btn" title="Gönder">→</button>
              </div>
            </div>
          </form>

          <div class="composer-meta">
            Mod: <strong id="meta-mode-label">Direct</strong> · <span id="meta-status-text">Hazır</span>
          </div>

          <input type="file" id="file-upload-input" accept="image/*" hidden />
          <input type="file" id="bundle-upload-input" multiple hidden />
        </div>
      </div>
    </main>

    <aside id="right-panel" class="right-panel is-open" aria-hidden="false" aria-label="Sağ panel">
      <div class="rp-head">
        <div class="rp-tabs" role="tablist">
          <button type="button" class="rp-tab active" data-rp-tab="live" role="tab">Canlı</button>
          <button type="button" class="rp-tab" data-rp-tab="memory" role="tab">Hafıza</button>
          <button type="button" class="rp-tab" data-rp-tab="locks" role="tab">Kilitler</button>
          <button type="button" class="rp-tab" data-rp-tab="files" role="tab">Dosyalar</button>
        </div>
      </div>
      <div id="right-panel-body" class="rp-body"></div>
    </aside>

    <div id="view-overlay" class="view-overlay" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="view-card">
        <div class="view-head">
          <h2 id="view-title"></h2>
          <button type="button" id="btn-view-close" class="icon-close" title="Kapat">×</button>
        </div>
        <div id="view-body" class="view-body"></div>
      </div>
    </div>

    <div id="search-overlay" class="search-overlay" aria-hidden="true">
      <div class="search-card">
        <div class="search-head">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" class="search-input" placeholder="Sohbet, proje, ayar veya ajan ara... (Ctrl+F)" autocomplete="off" />
          <span class="kbd-hint">ESC</span>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
